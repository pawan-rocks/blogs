name: Deploy Web to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

# ── Non-sensitive config — safe to commit ────────────────────────────────────
env:
  AWS_REGION:                 ap-south-1
  S3_BUCKET:                  tantuui-mumbai
  CLOUDFRONT_DISTRIBUTION_ID: E3T9CTZ972H5Y2

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # HTML files — no cache, synced to bucket root
      - name: Sync HTML to S3
        run: |
          aws s3 sync dist \
            s3://${{ env.S3_BUCKET }} \
            --region ${{ env.AWS_REGION }} \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html" \
            --delete \
            --exclude "pawan_mishra/*"

      # Assets — long cache (content-hashed by Vite)
      - name: Sync assets to S3
        run: |
          aws s3 sync dist \
            s3://${{ env.S3_BUCKET }} \
            --region ${{ env.AWS_REGION }} \
            --exclude "*.html" \
            --cache-control "public, max-age=31536000, immutable" \
            --delete \
            --exclude "pawan_mishra/*"

      - name: Invalidate CloudFront
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Print URL
        run: echo "🎉 Deployed → https://tantuui.com"
